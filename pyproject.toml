[project]
name = "aurora"
version = "0.1.0"
description = "Virtual assistant of the Residencial Aurora condominium."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "google-adk==2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
aurora-api = "aurora.api:main"
aurora-restaurar = "aurora.restore:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
